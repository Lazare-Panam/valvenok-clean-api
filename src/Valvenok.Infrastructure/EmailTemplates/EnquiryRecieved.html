<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #1c2e1a;
            background-color: #f7faf6;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
        }

        .header {
            padding: 30px 20px;
            text-align: center;
            background-color: #1c2e1a;
            border-bottom: 4px solid #61D649;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            margin: 0;
        }

        .notification-banner {
            background-color: #c8e8c0;
            color: #1c2e1a;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content {
            padding: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1c2e1a;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 2px solid #f7faf6;
            padding-bottom: 10px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

            .info-table td {
                padding: 12px 0;
                border-bottom: 1px solid #f0f0f0;
                vertical-align: top;
            }

        .label {
            width: 30%;
            font-size: 11px;
            font-weight: bold;
            color: #4a6b45;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            width: 70%;
            font-size: 14px;
            color: #1c2e1a;
        }

        .message-box {
            background-color: #f7faf6;
            padding: 20px;
            border-left: 4px solid #61D649;
            font-size: 14px;
            color: #1c2e1a;
            white-space: pre-line;
        }

        .footer {
            background-color: #f7faf6;
            padding: 20px;
            text-align: center;
            font-size: 11px;
            color: #4a6b45;
        }

        .btn-reply {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #61D649;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p class="brand-name">VALVENOK HQ</p>
        </div>

        <div class="notification-banner">
            New Customer Inquiry Received
        </div>

        <div class="content">
            <div class="section-title">Sender Details</div>
            <table class="info-table">
                <tr>
                    <td class="label">Name</td>
                    <td class="value"><strong>{{CustomerName}}</strong></td>
                </tr>
                <tr>
                    <td class="label">Email</td>
                    <td class="value">{{CustomerEmail}}</td>
                </tr>
                <tr>
                    <td class="label">Subject</td>
                    <td class="value">{{InquirySubject}}</td>
                </tr>
            </table>

            <div class="section-title">Message Content</div>
            <div class="message-box">
                {{CustomerMessage}}
            </div>
        </div>

        <div class="footer">
            <p>This is an automated notification from the Valvenok Contact Form.</p>
            <p>&copy; 2026 VALVENOK RETAIL GROUP</p>
        </div>
    </div>
</body>
</html>
